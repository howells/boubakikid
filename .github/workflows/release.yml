# Publishes to npm via trusted publishing (OIDC), which only works from a hosted
# CI runner. Renaming this file breaks publishing: npm's trusted publisher
# configuration names the workflow by filename.
name: Publish

# A version tag ships a release. The job refuses to run when the tag and the
# package.json version disagree.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check the tag matches package.json
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag says ${GITHUB_REF_NAME#v} but package.json says $version"
            exit 1
          fi

      - name: Build and pack
        run: |
          set -euo pipefail
          pnpm build
          mkdir -p "$GITHUB_WORKSPACE/release-artifacts"
          pnpm pack --pack-destination "$GITHUB_WORKSPACE/release-artifacts"

      # --provenance is passed explicitly; it is what attaches provenance.
      - name: Publish
        run: npm publish "$(ls "$GITHUB_WORKSPACE"/release-artifacts/*.tgz)" --provenance
